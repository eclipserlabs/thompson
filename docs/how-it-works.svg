<svg xmlns="http://www.w3.org/2000/svg" width="680" height="310" viewBox="0 0 680 310" role="img" aria-label="Thompson adaptive loop: select, persist, execute, verify, learn, with improved policy feeding back">
  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9aa4b2"/>
    </marker>
    <marker id="loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#a371f7"/>
    </marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
    <rect x="80" y="16" width="340" height="38" rx="9" fill="#24405e" stroke="#6aa5e0" stroke-width="1.5"/>
    <text x="250" y="40" text-anchor="middle" fill="#ffffff">Select an execution strategy</text>
    <line x1="250" y1="54" x2="250" y2="74" stroke="#9aa4b2" stroke-width="1.5" marker-end="url(#flow)"/>

    <rect x="80" y="76" width="340" height="38" rx="9" fill="#333a44" stroke="#9aa4b2" stroke-width="1.5"/>
    <text x="250" y="100" text-anchor="middle" fill="#ffffff">Persist the decision and its evidence</text>
    <line x1="250" y1="114" x2="250" y2="134" stroke="#9aa4b2" stroke-width="1.5" marker-end="url(#flow)"/>

    <rect x="80" y="136" width="340" height="38" rx="9" fill="#57451a" stroke="#d4a72c" stroke-width="1.5"/>
    <text x="250" y="160" text-anchor="middle" fill="#ffffff">Execute the selected strategy</text>
    <line x1="250" y1="174" x2="250" y2="194" stroke="#9aa4b2" stroke-width="1.5" marker-end="url(#flow)"/>

    <rect x="80" y="196" width="340" height="38" rx="9" fill="#1e4d33" stroke="#4ac26b" stroke-width="1.5"/>
    <text x="250" y="220" text-anchor="middle" fill="#ffffff">Receive an independently verified outcome</text>
    <line x1="250" y1="234" x2="250" y2="254" stroke="#9aa4b2" stroke-width="1.5" marker-end="url(#flow)"/>

    <rect x="80" y="256" width="340" height="38" rx="9" fill="#3d2a56" stroke="#a371f7" stroke-width="1.5"/>
    <text x="250" y="280" text-anchor="middle" fill="#ffffff">Persist, settle, and learn</text>

    <path d="M 425 275 C 595 275 595 35 425 35" fill="none" stroke="#a371f7" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#loop)"/>
    <text x="618" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#a371f7">improved</text>
    <text x="618" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#a371f7">policy</text>
  </g>
</svg>
