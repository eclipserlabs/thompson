apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-router
  labels:
    app: router
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: router
  template:
    metadata:
      labels:
        app: router
    spec:
      containers:
      - name: router
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - containerPort: {{ .Values.service.port }}
          name: http
        env:
        - name: PORT
          value: {{ .Values.service.port | quote }}
        - name: EVIDENCE_PATH
          value: {{ .Values.evidence.path | quote }}
        - name: ARMS
          value: {{ .Values.arms | quote }}
        - name: SHADOW_SAMPLE_RATE
          value: {{ .Values.shadow.sampleRate | quote }}
        - name: SHADOW_TIMEOUT
          value: {{ .Values.shadow.timeout | quote }}
        - name: SHADOW_MAX_CONCURRENCY
          value: {{ .Values.shadow.maxConcurrency | quote }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: {{ .Values.probes.liveness.path }}
            port: {{ .Values.probes.liveness.port }}
          initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
        readinessProbe:
          httpGet:
            path: {{ .Values.probes.readiness.path }}
            port: {{ .Values.probes.readiness.port }}
          initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
        volumeMounts:
        - name: evidence
          mountPath: /data
      volumes:
      - name: evidence
        emptyDir: {}
